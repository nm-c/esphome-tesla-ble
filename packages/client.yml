substitutions:
  ble_mac_address: !secret ble_mac_address
  tesla_vin: !secret tesla_vin
  charging_amps_max: "32"
  # Polling interval defaults (can be overridden in main config)
  vcsec_poll_interval: "10"
  infotainment_poll_interval_awake: "30"
  infotainment_poll_interval_active: "10"
  infotainment_sleep_timeout: "660"  # 11 minutes

ble_client:
  - mac_address: $ble_mac_address
    id: ble_tesla_id

# Tesla BLE Vehicle component (entities are exposed via the platform blocks below).
tesla_ble_vehicle:
  ble_client_id: ble_tesla_id
  id: tesla_ble_vehicle_id
  vin: $tesla_vin
  charging_amps_max: $charging_amps_max
  role: DRIVER  # Options: DRIVER (all controls) or CHARGING_MANAGER (charging + basic controls only)
  vcsec_poll_interval: $vcsec_poll_interval
  infotainment_poll_interval_awake: $infotainment_poll_interval_awake
  infotainment_poll_interval_active: $infotainment_poll_interval_active
  infotainment_sleep_timeout: $infotainment_sleep_timeout

binary_sensor:
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: asleep
    name: "Asleep"
    icon: mdi:sleep
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: user_present
    name: "User Present"
    icon: mdi:account-check
    device_class: occupancy
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: charger
    name: "Charger"
    icon: mdi:power-plug
    device_class: plug
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: parking_brake
    name: "Parking Brake"
    icon: mdi:car-brake-parking
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: door_driver_front
    name: "Door Driver Front"
    icon: mdi:car-door
    device_class: door
    disabled_by_default: true
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: door_driver_rear
    name: "Door Driver Rear"
    icon: mdi:car-door
    device_class: door
    disabled_by_default: true
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: door_passenger_front
    name: "Door Passenger Front"
    icon: mdi:car-door
    device_class: door
    disabled_by_default: true
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: door_passenger_rear
    name: "Door Passenger Rear"
    icon: mdi:car-door
    device_class: door
    disabled_by_default: true
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: window_driver_front
    name: "Window Driver Front"
    icon: mdi:car-window-side
    device_class: window
    disabled_by_default: true
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: window_driver_rear
    name: "Window Driver Rear"
    icon: mdi:car-window-side
    device_class: window
    disabled_by_default: true
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: window_passenger_front
    name: "Window Passenger Front"
    icon: mdi:car-window-side
    device_class: window
    disabled_by_default: true
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: window_passenger_rear
    name: "Window Passenger Rear"
    icon: mdi:car-window-side
    device_class: window
    disabled_by_default: true
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: sunroof
    name: "Sunroof"
    icon: mdi:car-select
    device_class: window
    disabled_by_default: true

sensor:
  - platform: ble_client
    type: rssi
    ble_client_id: ble_tesla_id
    name: "BLE Signal"
    icon: mdi:bluetooth
    update_interval: 60s
    entity_category: diagnostic
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: battery_level
    name: "Battery"
    icon: mdi:battery
    unit_of_measurement: "%"
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: range
    name: "Range"
    icon: mdi:map-marker-distance
    device_class: distance
    unit_of_measurement: "mi"
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: charger_power
    name: "Charger Power"
    icon: mdi:flash
    device_class: power
    unit_of_measurement: "kW"
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: charger_voltage
    name: "Charger Voltage"
    icon: mdi:lightning-bolt
    device_class: voltage
    unit_of_measurement: "V"
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: charger_current
    name: "Charger Current"
    icon: mdi:current-ac
    device_class: current
    unit_of_measurement: "A"
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: charging_rate
    name: "Charging Rate"
    icon: mdi:speedometer
    device_class: speed
    unit_of_measurement: "mph"
    accuracy_decimals: 1
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: energy_added
    name: "Energy Added"
    icon: mdi:battery-charging
    device_class: energy
    unit_of_measurement: "kWh"
    accuracy_decimals: 1
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: time_to_full
    name: "Time to Full"
    icon: mdi:clock-outline
    device_class: duration
    unit_of_measurement: "min"
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: outside_temp
    name: "Outside Temperature"
    icon: mdi:thermometer
    device_class: temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 1
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: odometer
    name: "Odometer"
    icon: mdi:counter
    device_class: distance
    unit_of_measurement: "mi"
    disabled_by_default: true
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: tpms_front_left
    name: "TPMS Front Left"
    icon: mdi:car-tire-alert
    device_class: pressure
    unit_of_measurement: "bar"
    accuracy_decimals: 1
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: tpms_front_right
    name: "TPMS Front Right"
    icon: mdi:car-tire-alert
    device_class: pressure
    unit_of_measurement: "bar"
    accuracy_decimals: 1
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: tpms_rear_left
    name: "TPMS Rear Left"
    icon: mdi:car-tire-alert
    device_class: pressure
    unit_of_measurement: "bar"
    accuracy_decimals: 1
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: tpms_rear_right
    name: "TPMS Rear Right"
    icon: mdi:car-tire-alert
    device_class: pressure
    unit_of_measurement: "bar"
    accuracy_decimals: 1

text_sensor:
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: charging_state
    name: "Charging"
    icon: mdi:ev-station
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: iec61851_state
    name: "IEC 61851"
    icon: mdi:ev-plug-type2
    disabled_by_default: true
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: shift_state
    name: "Shift State"
    icon: mdi:car-shift-pattern
    disabled_by_default: true

button:
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: wake
    name: "Wake up"
    icon: mdi:sleep-off
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: pair
    name: "Pair BLE Key"
    icon: mdi:key-wireless
    entity_category: diagnostic
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: regenerate_key
    name: "Regenerate key"
    icon: mdi:key-change
    entity_category: diagnostic
    disabled_by_default: true
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: force_update
    name: "Force data update"
    icon: mdi:database-sync
    entity_category: diagnostic
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: unlatch_driver_door
    name: "Unlatch Driver Door"
    icon: mdi:car-door
    disabled_by_default: true
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: flash_lights
    name: "Flash Lights"
    icon: mdi:car-light-high
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: honk_horn
    name: "Sound Horn"
    icon: mdi:bullhorn

switch:
  - platform: ble_client
    ble_client_id: ble_tesla_id
    name: "BLE Connection"
    entity_category: diagnostic
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: charging
    name: "Charger"
    icon: mdi:ev-station
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: steering_wheel_heat
    name: "Heated Steering"
    icon: mdi:steering
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: sentry_mode
    name: "Sentry Mode"
    icon: mdi:shield-car
    restore_mode: RESTORE_DEFAULT_OFF

number:
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: charging_amps
    name: "Charging Amps"
    icon: mdi:current-ac
    unit_of_measurement: "A"
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: charging_limit
    name: "Charging Limit"
    icon: mdi:battery-charging-100
    unit_of_measurement: "%"

lock:
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: doors
    name: "Doors"
    icon: mdi:car-door-lock
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: charge_port_latch
    name: "Charge Port Latch"
    icon: mdi:ev-plug-tesla

cover:
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: trunk
    name: "Trunk"
    icon: mdi:car-back
    device_class: door
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: frunk
    name: "Frunk"
    icon: mdi:car
    device_class: door
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: windows
    name: "Windows"
    icon: mdi:car-door
    device_class: awning
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    type: charge_port_door
    name: "Charge Port Door"
    icon: mdi:ev-plug-tesla
    device_class: door

climate:
  - platform: tesla_ble_vehicle
    tesla_ble_id: tesla_ble_vehicle_id
    name: "Climate"
