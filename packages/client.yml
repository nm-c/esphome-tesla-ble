substitutions:
  ble_mac_address: !secret ble_mac_address
  tesla_vin: !secret tesla_vin
  charging_amps_max: "32"
  # Polling interval defaults (can be overridden in main config)
  vcsec_poll_interval: "10"
  infotainment_poll_interval_awake: "30"
  infotainment_poll_interval_active: "10"
  infotainment_sleep_timeout: "660"  # 11 minutes
  # IDs used by the entities.yml preset. Override in your top-level
  # substitutions if your `ble_client:` / `tesla_ble_vehicle:` use different ids.
  tesla_ble_id: tesla_ble_vehicle_id
  ble_client_id: ble_tesla_id

ble_client:
  - mac_address: $ble_mac_address
    id: $ble_client_id

# Tesla BLE Vehicle parent component. Entity exposure happens via entities.yml
# — skip the `packages:` include and write your own platform blocks for a subset.
tesla_ble_vehicle:
  ble_client_id: $ble_client_id
  id: $tesla_ble_id
  vin: $tesla_vin
  charging_amps_max: $charging_amps_max
  role: DRIVER  # DRIVER (all controls) or CHARGING_MANAGER (charging + basic only)
  vcsec_poll_interval: $vcsec_poll_interval
  infotainment_poll_interval_awake: $infotainment_poll_interval_awake
  infotainment_poll_interval_active: $infotainment_poll_interval_active
  infotainment_sleep_timeout: $infotainment_sleep_timeout

# Tesla entity preset: 49 Tesla entities + BLE Signal sensor + BLE Connection
# switch, all wired to `$tesla_ble_id` / `$ble_client_id`.
packages:
  tesla_entities: !include entities.yml
